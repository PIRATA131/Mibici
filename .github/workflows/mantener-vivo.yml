name: API en línea

# El plan gratuito de Render duerme el servicio tras 15 minutos sin trafico y tarda
# entre 30 y 60 segundos en despertar. Este flujo lo consulta para que responda al
# instante, y de paso hace de monitor: no se conforma con un 200, comprueba que el
# artefacto del modelo este cargado y pide una prediccion real. Si el API cayera en
# modo degradado, esta ejecucion se pondria en rojo y la insignia del README lo diria.
#
# Sobre la cadencia: las ejecuciones programadas de GitHub son "mejor esfuerzo" y se
# retrasan o se saltan cuando la plataforma esta cargada, mas aun con intervalos muy
# cortos. Por eso cada ejecucion no consulta una sola vez: se queda despierta un rato
# consultando cada pocos minutos. Asi, aunque GitHub se salte un disparo, la ventana
# sin trafico no llega a los 15 minutos que Render necesita para dormir el servicio.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  API: https://mibici-api-v8k6.onrender.com

jobs:
  consultar:
    name: Consultar y vigilar
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Despertar y verificar el servicio
        run: |
          inicio=$(date +%s%3N)
          codigo=$(curl --silent --show-error --max-time 180 \
                        --output respuesta.json \
                        --write-out "%{http_code}" \
                        "$API/salud")
          fin=$(date +%s%3N)
          ms=$((fin - inicio))

          {
            echo "### API en línea"
            echo
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| endpoint | \`$API/salud\` |"
            echo "| código | $codigo |"
            echo "| latencia | ${ms} ms |"
            echo "| consultado | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo
            echo '```json'
            cat respuesta.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "HTTP $codigo en ${ms} ms"
          cat respuesta.json
          echo

          if [ "$codigo" != "200" ]; then
            echo "::error::El API respondió $codigo en lugar de 200."
            exit 1
          fi

          # Responder 200 no basta: el API tambien contesta cuando se quedo sin
          # artefacto y esta sirviendo la linea base. Eso es una degradacion
          # silenciosa y queremos enterarnos.
          if ! grep -q '"estado":"ok"' respuesta.json; then
            echo "::error::El API responde, pero no en estado ok (modo degradado)."
            exit 1
          fi
          if ! grep -q '"modelo_cargado":true' respuesta.json; then
            echo "::error::El API responde, pero el modelo no está cargado."
            exit 1
          fi

      - name: Comprobar que el modelo predice de verdad
        run: |
          # Una prediccion real: si el artefacto estuviera corrupto, /salud podria
          # pasar y esta llamada no.
          codigo=$(curl --silent --show-error --max-time 60 \
                        --header "Content-Type: application/json" \
                        --data '{"estacion_id":194,"fecha_hora":"2026-11-27T18:00:00"}' \
                        --output prediccion.json \
                        --write-out "%{http_code}" \
                        "$API/predecir")
          echo "HTTP $codigo"
          cat prediccion.json
          echo
          test "$codigo" = "200"
          grep -q '"salidas_estimadas"' prediccion.json

      - name: Mantener el servicio despierto el resto de la ventana
        # Dos consultas mas, espaciadas, para cubrir los diez minutos hasta el
        # siguiente disparo aunque GitHub lo retrase.
        run: |
          for minuto in 4 8; do
            sleep 240
            codigo=$(curl --silent --max-time 60 --output /dev/null \
                          --write-out "%{http_code}" "$API/salud")
            echo "minuto +${minuto}: HTTP $codigo"
            # Aqui no se falla la ejecucion: la verificacion seria ya paso en los
            # pasos anteriores y este paso solo existe para que no se duerma.
          done
